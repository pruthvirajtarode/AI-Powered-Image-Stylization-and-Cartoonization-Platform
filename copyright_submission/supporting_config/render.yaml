services:
  - type: web
    name: toonify-ai-saas
    env: docker
    plan: free
    region: oregon
    branch: main
    healthCheckPath: /ping
    envVars:
      - key: PORT
        value: 5000
      - key: DEBUG
        value: "False"
      - key: APP_NAME
        value: Toonify
      - key: SECRET_KEY
        generateValue: true          # Auto-generate a secure random secret
      - key: PAYMENT_AMOUNT
        value: "3300"
      - key: PAYMENT_CURRENCY
        value: INR
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: SMTP_SERVER
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_SENDER
        sync: false
      # ── FRESH DATABASE (toonify-db-v4) ───────────────────────────────────────
      # v3 expired — v4 is the new active database.
      - fromDatabase:
          name: toonify-db-v4
          property: internalConnectionString
        key: DATABASE_URL
      - fromDatabase:
          name: toonify-db-v4
          property: internalConnectionString
        key: DATABASE_URI

# ── DATABASES ─────────────────────────────────────────────────────────────────
# v3 kept intentionally so Render does not delete it.
# v4 is the new active database.
databases:
  - name: toonify-db-v3
    databaseName: toonify_production_v3
    plan: free
    region: oregon

  - name: toonify-db-v4
    databaseName: toonify_production_v4
    plan: free
    region: oregon
